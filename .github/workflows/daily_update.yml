name: Daily Stock Data Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance streamlit

      - name: Run update script and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          # GARANTIE-CLEANUP: Löscht absolut alle lokalen Änderungen/Konflikte im Keim
          git reset --hard HEAD
          git clean -fd
          
          # Jetzt absolut fehlerfreier Pull
          git pull origin main --rebase
          
          # Daten generieren
          python update_data.py
          
          # Speichern, committen und pushen
          git add uni_snapshot.csv
          git commit -m "Tägliches Aktien-Daten-Update" || echo "No changes to commit"
          git push origin main
          # Ändern, committen und pushen
          git add uni_snapshot.csv
          git commit -m "Tägliches Aktien-Daten-Update" || echo "No changes to commit"
          git push origin main
